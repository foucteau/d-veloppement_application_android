name: Calculatrice Android - build et tests
on:
  push:
    paths:
      - 'applications/calculatrice-test/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/calculatrice-test.yml'
  pull_request:
    paths:
      - 'applications/calculatrice-test/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/calculatrice-test.yml'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK debug
        run: gradle :applications:calculatrice-test:assembleDebug
      - name: Autoriser accélération KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Tests Android sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :applications:calculatrice-test:connectedDebugAndroidTest
      - name: Conserver APK et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-test-resultats
          path: |
            applications/calculatrice-test/build/outputs/apk/debug/*.apk
            applications/calculatrice-test/build/reports/androidTests/**
            applications/calculatrice-test/build/outputs/androidTest-results/**
          if-no-files-found: warn
