name: Compteur simple - Android build et tests
on:
  push:
    paths:
      - 'applications/compteur-simple/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/compteur-simple.yml'
  pull_request:
    paths:
      - 'applications/compteur-simple/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/compteur-simple.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK debug
        id: compilation
        run: gradle :applications:compteur-simple:assembleDebug
      - name: Activer KVM
        run: sudo chmod 666 /dev/kvm
      - name: Tester sur émulateur
        id: emulator_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :applications:compteur-simple:connectedDebugAndroidTest
      - name: Archiver APK et rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compteur-simple-resultats
          path: |
            applications/compteur-simple/build/outputs/apk/debug/*.apk
            applications/compteur-simple/build/reports/androidTests/**
            applications/compteur-simple/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Enregistrer le dernier résultat consultable sans URL
        if: always() && github.event_name != 'pull_request'
        env:
          COMPILE_RESULT: ${{ steps.compilation.outcome }}
          TEST_RESULT: ${{ steps.emulator_tests.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p suivi
          python3 - <<'PY'
          import json, os, datetime
          data = {
            "application": "compteur-simple",
            "run_id": int(os.environ["RUN_ID"]),
            "run_attempt": int(os.environ["RUN_ATTEMPT"]),
            "run_url": f'https://github.com/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',
            "source_commit": os.environ["COMMIT_SHA"],
            "compilation": os.environ["COMPILE_RESULT"],
            "tests_emulateur": os.environ["TEST_RESULT"],
            "archive": "compteur-simple-resultats",
            "date_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open("suivi/compteur-simple-dernier-run.json", "w", encoding="utf-8") as out:
              json.dump(data, out, ensure_ascii=False, indent=2)
              out.write("\\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suivi/compteur-simple-dernier-run.json
          if ! git diff --cached --quiet; then
            git commit -m "suivi: résultat automatique du compteur [skip ci]"
            git push origin HEAD:main
          fi
